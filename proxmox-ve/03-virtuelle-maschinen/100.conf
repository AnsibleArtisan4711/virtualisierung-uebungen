# Beispiel einer VM-Konfiguration (erfunden); Aufbau aus Fachwissen
agent: 1
boot: order=scsi0;ide2
cores: 2
cpu: x86-64-v2-AES
ide2: local:iso/debian-12.iso,media=cdrom
memory: 2048
name: web01
net0: virtio=BC:24:11:AA:BB:CC,bridge=vmbr0,firewall=1
numa: 0
ostype: l26
scsi0: local-lvm:vm-100-disk-0,size=20G,discard=on
scsihw: virtio-scsi-single
sockets: 1
vga: std
