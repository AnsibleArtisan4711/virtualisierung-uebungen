dir: local
	path /var/lib/vz
	content iso,vztmpl,backup

lvmthin: local-lvm
	thinpool data
	vgname pve
	content rootdir,images

nfs: nas-iso
	server 10.6.0.50
	export /export/iso
	content iso,backup,images

pbs: pbs01
	server 10.6.0.60
	datastore store1
	content backup,images

lvm: san-lvm
	vgname vg-san
	content iso
